name: AdvaetaGeoShare
options:
  bundleIdPrefix: com.advaetarides
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AdvaetaGeoShare:
    type: application
    platform: iOS
    sources:
      - Sources/AdvaetaGeoShare
    info:
      path: Sources/AdvaetaGeoShare/Info.plist
      properties:
        CFBundleDisplayName: AdvaetaGeoShare
        CFBundleVersion: "5"
        UILaunchScreen: {}
        LSApplicationQueriesSchemes:
          - osmandmaps
        UIAppFonts:
          - Cinzel-Regular.ttf
          - Cinzel-Bold.ttf
          - Cinzel-Black.ttf
          - CinzelDecorative-Bold.ttf
          - CinzelDecorative-Black.ttf
          - CormorantGaramond-Regular.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaetarides.AdvaetaGeoShare
        TARGETED_DEVICE_FAMILY: "1"
  AdvaetaGeoShareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AdvaetaGeoShareTests
    dependencies:
      - target: AdvaetaGeoShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaetarides.AdvaetaGeoShareTests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  AdvaetaGeoShare:
    build:
      targets:
        AdvaetaGeoShare: all
        AdvaetaGeoShareTests: [test]
    test:
      targets:
        - AdvaetaGeoShareTests
    run:
      config: Debug
